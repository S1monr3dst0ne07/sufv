<html>
    <head>
        <title>File View</title>
<style>
*
{
	font-family: consolas;
}
h2
{
    width: 100%;
	text-align: center;
}

body
{
	text-align: center;
}

#listing-view
{
	display: inline-block;
	border: 1px solid black;
	border-radius: 5px;
	padding: 10px;
}

.listing-entry svg
{
    height: 1.5em;
    width: auto;
    flex: 0 0 auto;
}
.listing-entry p 
{
    margin: 0;
}
.listing-entry
{
    display: flex;
}
.listing-entry:hover
{
    align-items: left;
    text-decoration: underline;
    background: lightgray;
}
p
{
	text-align: left;
	margin: 0px;
	font-size: 120%;
}
pre
{
    text-align: left;
}
</style>
    </head>
    <body>
        <div id='listing-view'></div>
    </body>

    <script>

function get_dir_listing(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", path, false);
    xhr.setRequestHeader("Action", "Listing");
    xhr.send(null);

    var listing = [];
    xhr.responseText.split('\n').forEach(line => {
        if (line == '') return;

        var comps = line.split(',');
        var type = comps.shift();
        var name = comps.join(',');

        if (['.', '..'].includes(name))
            return;

        listing.push({
            'type': type,
            'name': name,
        });
    });

    return listing;
}


function get_dir_check(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", path, false);
    xhr.setRequestHeader("Action", "CheckDir");
    xhr.send(null);

    var listing = [];
    switch (xhr.responseText) {
        case "yes": return true;
        case "no":  return false;
        default:    return false;
    }
}


function build_dir_entry(path, name_str, level) {
    var container = document.createElement("div");
    var body = document.createElement('div');
    var header = document.createElement("div");

    container.appendChild(header);
    container.appendChild(body);

    header.classList.add('listing-entry');
    var icon = document.createElement("div");
    var name = document.createElement("p");
    name.innerText = name_str;
    header.appendChild(icon);
    header.appendChild(name);

    icon.innerHTML = `
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M9 6L15 12L9 18" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
    `;

    var open_state = false;
    header.onclick = () => {
        open_state = !open_state;
        var icon_svg = icon.firstElementChild

        if (open_state) {
            icon_svg.setAttribute("transform", "rotate(90)");
            icon_svg.firstElementChild.setAttribute('stroke', '#000');

            build_listing(path, body, level+1)
        } else {
            icon_svg.setAttribute("transform", "rotate(0)");
            icon_svg.firstElementChild.setAttribute('stroke', '#aaa');

            body.innerHTML = '';
        }
    };

    return container;
}


function build_file_entry(path, name_str, level) {
    var header = document.createElement("div");

    header.classList.add('listing-entry');

    var name = document.createElement("p");
    name.innerText = name_str;
    header.appendChild(name);

    header.onclick = () => {
        window.location.pathname = path;
    };

    return header;
}


function build_listing(path, target, level=0) {
    console.log("path", path);
    listing = get_dir_listing(path) 

    listing.sort((a, b) => {
        if (a.type == 'dir' && b.type != 'dir') return  1;
        if (a.type != 'dir' && b.type == 'dir') return -1;

        n1 = a.name;
        n2 = b.name;
        return n1.localeCompare(n2);
    });

    listing.forEach(dirent => {
        subpath = path + dirent.name;

        switch(dirent.type) {
            case 'dir':  node = build_dir_entry (subpath + '/', dirent.name, level); break;
            case 'file': node = build_file_entry(subpath      , dirent.name, level); break;
            default: return;
        }

        node.style.paddingLeft = `${level*20}px`;
        target.appendChild(node);
    });
}

var base_path = window.location.pathname;

function run_listing_view() {
    view = document.getElementById('listing-view');
    view.innerHTML = '';
    title = document.createElement('h2');
    view.appendChild(title)

    title.innerText = `listing of ${base_path}`;
    build_listing(base_path, view);
}

function download_file(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", path, false);
    xhr.send(null);
    return xhr.responseText;
}

function run_file_view() {
    view = document.getElementById('listing-view');
    view.innerHTML = '';
    title = document.createElement('h2');
    title.innerText = `content of ${base_path}`;
    view.appendChild(title)


    var file_path = base_path + '&';
    var ext = base_path.split('.').at(-1);
    switch(ext)
    {
        case 'jpg':
        case 'jpeg':
        case 'png':
            content = document.createElement('img');
            content.src = file_path;
            content.height = window.innerHeight * 0.8;
            break;

        default:
            content = document.createElement('pre');
            content.innerText = download_file(file_path);
            break;
    }

    view.appendChild(content);
}


if (get_dir_check(base_path))
    run_listing_view();
else
    run_file_view();


    </script>
</html>
