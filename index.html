<html>
    <head>
        <title>File View</title>
<style>
*
{
	font-family: consolas;
}
h2
{
    width: 100%;
    text-align: center;
}
iframe
{
    width:  100%;
    height: 100%;
    resize: both;
    overflow: auto;
}
.listing-container-file
{
    text-align: center;
}
#listing-view
{
	display: inline-block;
	border: 1px solid black;
	border-radius: 5px;
	padding: 10px;
}

.listing-entry svg
{
    height: 1.5em;
    width: auto;
    flex: 0 0 auto;
}
.listing-entry p 
{
    margin: 0;
    user-select: none;
}
.listing-entry
{
    display: flex;
}
.listing-entry:hover
{
    background: lightgray;
}
.listing-entry p:hover
{
    text-decoration: underline;
    cursor: pointer;
}
p
{
	text-align: left;
	margin: 0px;
	font-size: 120%;
}
pre
{
    text-align: left;
}
</style>
    </head>
    <body>
        <div id='listing-container'>
            <div id='listing-view'></div>
        </div>
    </body>

    <script>

function get_dir_listing(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", path, false);
    xhr.setRequestHeader("Action", "Listing");
    xhr.send(null);

    var listing = [];
    xhr.responseText.split('\n').forEach(line => {
        if (line == '') return;

        var comps = line.split(',');
        var type = comps.shift();
        var name = comps.join(',');

        if (['.', '..'].includes(name))
            return;

        listing.push({
            'type': type,
            'name': name,
        });
    });

    return listing;
}


function get_dir_check(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", path, false);
    xhr.setRequestHeader("Action", "CheckDir");
    xhr.send(null);

    var listing = [];
    switch (xhr.responseText) {
        case "yes": return true;
        case "no":  return false;
        default:    return false;
    }
}


function build_dir_entry(path, name_str, level) {
    var container = document.createElement("div");
    var body = document.createElement('div');
    var header = document.createElement("div");

    container.appendChild(header);
    container.appendChild(body);

    header.classList.add('listing-entry');
    var icon = document.createElement("div");
    var name = document.createElement("p");
    header.appendChild(icon);
    header.appendChild(name);

    name.innerText = name_str;

    icon.innerHTML = `
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M9 6L15 12L9 18" stroke="#aaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
    `;

    var icon_svg = icon.firstElementChild;
    var open_state = false;
    function update_icon_color(state) {
        color = !state ? "#aaa" : "#333";
        icon_svg.firstElementChild.setAttribute('stroke', color);
    }

    icon.onmouseover = () => update_icon_color(!open_state);
    icon.onmouseout  = () => update_icon_color( open_state);

    header.onclick = () => {
        open_state = !open_state;

        if (open_state) {
            icon_svg.setAttribute("transform", "rotate(90)");
            build_listing(path, body, level+1)
        } else {
            icon_svg.setAttribute("transform", "rotate(0)");
            body.innerHTML = '';
        }

        update_icon_color(open_state);
    };

    name.onclick = () => {
        window.location.pathname = path;
    }

    return container;
}


function build_file_entry(path, name_str, level) {
    var header = document.createElement("div");

    header.classList.add('listing-entry');

    var name = document.createElement("p");
    name.innerText = name_str;
    header.appendChild(name);

    header.onclick = () => {
        window.location.pathname = path;
    };

    return header;
}


function build_listing(path, target, level=0) {
    console.log("path", path);
    listing = get_dir_listing(path) 

    listing.sort((a, b) => {
        if (a.type == 'dir' && b.type != 'dir') return  1;
        if (a.type != 'dir' && b.type == 'dir') return -1;

        n1 = a.name;
        n2 = b.name;
        return n1.localeCompare(n2);
    });

    listing.forEach(dirent => {
        subpath = path + dirent.name;

        switch(dirent.type) {
            case 'dir':  node = build_dir_entry (subpath + '/', dirent.name, level); break;
            case 'file': node = build_file_entry(subpath      , dirent.name, level); break;
            default: return;
        }

        node.style.paddingLeft = `${level*20}px`;
        target.appendChild(node);
    });
}

var base_path = window.location.pathname;


function add_nav_buttons(target) {
    container = document.createElement('div');

    path_parts = base_path.split('/').filter(x => x != '');
    path_parts.pop();
    up_path = '/' + path_parts.join('/');

    up_btn = document.createElement('a');
    up_btn.href = up_path;
    up_btn.innerHTML = '<h3 style="margin: .4em">up</h3>';
    container.appendChild(up_btn);

    home_btn = document.createElement('a');
    home_btn.href = '/';
    home_btn.innerHTML = '<h3 style="margin: .4em">home</h3>';
    container.appendChild(home_btn);

    container.style = "text-align: center; display: flex";

    target.appendChild(container);
}


function run_listing_view() {
    view = document.getElementById('listing-view');
    view.innerHTML = '';
    title = document.createElement('h2');
    view.appendChild(title)

    title.innerText = `listing of ${base_path}`;
    add_nav_buttons(view);
    build_listing(base_path, view);
}

function download_file(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", path, false);
    xhr.send(null);
    return xhr.responseText;
}

function get_filename_by_path(path) {
    return path.split('/').at(-1);
}

function run_file_view() {
    view = document.getElementById('listing-view');
    view.innerHTML = '';
    title = document.createElement('h2');
    title.innerText = `content of ${decodeURI(base_path)}`;
    view.appendChild(title)
    add_nav_buttons(view);


    var file_path = base_path + '&';
    var ext = base_path.includes('.') ? base_path.split('.').at(-1) : '';
    switch(ext.toLowerCase())
    {
        case 'jpg':
        case 'jpeg':
        case 'png':
            content = document.createElement('img');
            content.src = file_path;
            content.height = window.innerHeight * 0.8;
            break;

        case 'mp4':
        case 'mkv':
            content = document.createElement('video');
            content.controls = true;
            content.src = file_path;
            content.height = window.innerHeight * 0.8;
            break;
        
        case 'txt':
        case '':
            content = document.createElement('pre');
            content.innerText = download_file(file_path);
            break;

        case 'html':
            const new_doc = download_file(file_path);
            const new_dom = (new DOMParser()).parseFromString(new_doc, "text/html");

            const link_patcher = () => {
                var link_patch = (doc) => {
                    console.log("patching links!");
                    for (const attr of ['href', 'src', 'action', 'formaction', 'poster', 'cite'])
                    {
                        doc.querySelectorAll(`[${attr}]`).forEach(el => {
                            const value = el.getAttribute(attr);
                            if (!value) return;
                            const url = new URL(value, doc.baseURI);
                            if (url.protocol !== location.protocol) return;
                            if (url.origin   !== location.origin  ) return;
                            if (value.endsWith('/')) return;
                            if (value.endsWith('&')) return;

                            el.setAttribute(attr, value + '&');
                        });
                    };
                    doc.querySelectorAll('[srcset]').forEach(el => {
                        const value = el.getAttribute('srcset');
                        if (!value) return;

                        el.setAttribute('srcset', (() => {
                            const parts = value.trim().split(' ');
                            if (!parts[0]) return value;
                            const url = parts[0];

                            if (url.endsWith('/')) return;
                            if (url.endsWith('&')) return;

                            parts[0] = url + '&';
                            return parts.join(' ');
                        })());

                    });
                };

                link_patch(document);
                document.querySelectorAll('iframe').forEach((iframe) => {
                    iframe.addEventListener('load', () => {
                        link_patch(iframe.contentDocument);
                    });
                });
            };

            document.replaceChild(
              document.importNode(new_dom.documentElement, true),
              document.documentElement
            );

            
            const link_patcher_script = document.createElement('script');
            link_patcher_script.textContent = `(${link_patcher.toString()})();`;
            document.body.appendChild(link_patcher_script);

            return;


        default:
            content = document.createElement('p');
            content.innerText = 'content cannot be displayed in browser :(';

            content.appendChild(document.createElement('br'));

            var filename = get_filename_by_path(base_path)
            download_btn = document.createElement('a');
            download_btn.setAttribute('href', file_path);
            download_btn.setAttribute('download', filename);
            download_btn.innerText = `download ${filename}`;

            content.appendChild(download_btn);

            break;
    }

    view.appendChild(content);
}

if (get_dir_check(base_path))
{
    run_listing_view();

    // fix listing-view alignment
    listing_view = document.getElementById('listing-view');
    var rect = listing_view.getBoundingClientRect();
    listing_view.style.marginLeft = (window.innerWidth - rect.width) / 2;
}
else
{
    run_file_view();
    listing_view = document.getElementById('listing-container');
    listing_view.classList.add('listing-container-file')
}


    </script>
</html>
