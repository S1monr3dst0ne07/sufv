    <script>

function get_dir_listing(path) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", path, false);
    xhr.setRequestHeader("Action", "Listing");
    xhr.send(null);

    return xhr.responseText;
}

var source_path = window.location.pathname;
var listing = get_dir_listing(source_path);

console.log(listing);

    </script>
